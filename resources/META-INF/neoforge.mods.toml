# The one mixin in the mod. MineColonies writes "go to bed" straight into CitizenAI with only a
# guard-job exemption, so the profession whose whole point is the dark needs this to stay up for it -
# and a thief who is already out needs it so his job does not stall at dusk. See the class comment.
[[mixins]]
config="colonist_thieves.mixins.json"
